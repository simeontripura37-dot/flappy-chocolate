<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Flappy Bird: Chocolate Edition</title>
  
  <!-- PWA Metadata -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="logo.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FlappyChoc">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #281408; /* Dark chocolate aesthetic background outer frame */
      font-family: 'Arial', sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100%;
      max-height: 850px;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background-color: #70c5ce;
    }
    /* Control Interface Overlay */
    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none; /* Allows click-through to game canvas */
    }
    .btn {
      pointer-events: auto; /* Re-enables interaction for buttons */
      background: #e86100;
      border: 3px solid #fff;
      border-radius: 8px;
      color: #fff;
      font-weight: bold;
      font-size: 14px;
      padding: 10px 16px;
      cursor: pointer;
      box-shadow: 0 4px 0 #b04900;
      text-transform: uppercase;
      transition: transform 0.1s;
    }
    .btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #b04900;
    }
    #home-btn {
      background: #4aac23;
      box-shadow: 0 4px 0 #327a18;
    }
    #home-btn:active {
      box-shadow: 0 2px 0 #327a18;
    }
    #controls-row {
      position: absolute;
      top: 15px;
      right: 15px;
      display: flex;
      gap: 10px;
      z-index: 100;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <!-- UI Action Menu -->
    <div id="ui-layer">
      <div id="controls-row">
        <button id="pause-btn" class="btn">Pause</button>
        <button id="home-btn" class="btn">Home</button>
      </div>
    </div>
    
    <!-- Render Window -->
    <canvas id="gameCanvas"></canvas>
  </div>

  <!-- Game Engine Execution Script -->
  <script src="sound.js"></script>
</body>
</html>
